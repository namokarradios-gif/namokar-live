<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1008 Days Live Namokar Jaap</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:8px 10px 12px;
 font-family:Arial,sans-serif;
 background:linear-gradient(145deg,#07152d 0%,#0a1d3b 55%,#07142a 100%);
 text-align:center;
 color:#fff;
}

.container{
 max-width:620px;
 margin:auto;
}

h1{
 margin:2px 0 2px;
 font-size:27px;
 line-height:1.08;
 color:#f4d9bd;
 font-weight:800;
}

.subtitle{
 font-size:18px;
 color:#f0c7b0;
 margin-bottom:3px;
 font-weight:600;
}

.limit{
 font-size:15px;
 color:#f5e4d5;
 margin-bottom:10px;
 font-weight:700;
}

input{
 width:90%;
 max-width:560px;
 padding:11px 16px;
 margin:3px 0;
 border:0;
 border-radius:10px;
 font-size:17px;
 background:#fff;
 color:#333;
 box-shadow:0 2px 8px rgba(0,0,0,.12);
}

#fullNameDisplay{
 min-height:24px;
 margin:5px 0 9px;
 font-size:20px;
 font-weight:800;
 color:#fff;
}

#micStatus{
 margin:4px 0 2px;
 font-weight:800;
 color:#fff;
 font-size:16px;
}

#onair{
 font-size:18px;
 font-weight:bold;
 color:#ff5454;
 margin:2px 0;
}

#timerLabel{
 font-size:15px;
 font-weight:800;
 color:#f5e4d5;
 margin-top:2px;
}

#timer{
 font-size:31px;
 font-weight:900;
 margin:0 0 7px;
 color:#fff;
}

button{
 border:0;
 border-radius:10px;
 padding:12px 24px;
 margin:3px 4px;
 font-size:17px;
 font-weight:800;
 cursor:pointer;
 min-width:175px;
 box-shadow:0 3px 8px rgba(0,0,0,.15);
}

#recordBtn{
 background:#f4b52f;
 color:#fff;
}

#stopBtn{
 background:#e45d73;
 color:#fff;
}

#submitBtn{
 background:#39c965;
 color:#fff;
 min-width:240px;
 margin-top:7px;
}

button:disabled{
 opacity:.45;
}

audio{
 width:92%;
 max-width:560px;
 margin-top:6px;
 border-radius:20px;
}

#message{
 margin-top:7px;
 font-weight:bold;
 color:#f4d9bd;
 min-height:20px;
 font-size:15px;
}

.listen{
 margin:11px auto 0;
 padding-top:9px;
 border-top:1px solid rgba(255,255,255,.22);
 width:88%;
}

.listen a{
 color:#8fd8ff;
 text-decoration:none;
 font-size:17px;
 font-weight:700;
}

.mic{
 display:inline-block;
 width:14px;
 height:14px;
 background:#16a34a;
 border-radius:50%;
 margin-right:7px;
}

.blink{
 animation:blink 1s infinite;
}

@keyframes blink{
 0%,100%{opacity:1}
 50%{opacity:.25}
}

@media(max-width:520px){

 h1{
  font-size:25px;
 }

 .subtitle{
  font-size:17px;
 }

 input{
  padding:10px 15px;
 }

 button{
  min-width:155px;
  padding:11px 17px;
  font-size:16px;
 }

 #submitBtn{
  min-width:220px;
 }

}
</style>
</head>

<body>

<div class="container">

<h1>Join 24/7 Live Namokar Jaap</h1>

<div class="subtitle">
Chant Namokar in your Voice
</div>

<div class="limit">
Up to 5 minutes
</div>

<input type="text" id="firstName" placeholder="First Name" autocomplete="given-name">

<input type="text" id="surname" placeholder="Surname" autocomplete="family-name">

<div id="fullNameDisplay"></div>

<div id="micStatus">
<span class="mic blink"></span> Microphone Ready
</div>

<div id="onair" style="display:none;">
🔴 ON AIR
</div>

<div id="timerLabel">
TIME REMAINING
</div>

<div id="timer">
05:00
</div>

<div>
<button id="recordBtn">🎙 RECORD</button>
<button id="stopBtn" disabled>⏹ STOP</button>
</div>

<audio id="preview" controls style="display:none;"></audio>

<br>

<button id="submitBtn" disabled>
✓ SUBMIT
</button>

<div id="message"></div>

<div class="listen">
<a href="https://tunein.com/radio/NAMOKAR-RADIOS-s349685/"
target="_blank"
rel="noopener">
🎙 Listen to Live Namokar Radio
</a>
</div>

<audio id="tanpura"
src="tanpura.mp3"
preload="auto"
loop>
</audio>

</div>

<script>

const recordBtn=document.getElementById("recordBtn");
const stopBtn=document.getElementById("stopBtn");
const submitBtn=document.getElementById("submitBtn");
const preview=document.getElementById("preview");
const tanpura=document.getElementById("tanpura");
const micStatus=document.getElementById("micStatus");
const onair=document.getElementById("onair");
const timerDisplay=document.getElementById("timer");
const message=document.getElementById("message");
const firstNameInput=document.getElementById("firstName");
const surnameInput=document.getElementById("surname");
const fullNameDisplay=document.getElementById("fullNameDisplay");

function updateFullName(){

 const f=firstNameInput.value.trim();
 const s=surnameInput.value.trim();

 fullNameDisplay.textContent=(f+" "+s).trim().toUpperCase();

}

firstNameInput.addEventListener("input",updateFullName);
surnameInput.addEventListener("input",updateFullName);

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwasN4Nh7O1C4Nhpdn1noFyRDJ7rz7mN9CnHa1c8AzibfaR_HKbezA3C7u_pg9fxolCPQ/exec";

let audioContext=null;
let micStream=null;
let micSource=null;
let tanpuraSource=null;
let mixDestination=null;

let micGain=null;
let tanpuraRecordGain=null;
let tanpuraSpeakerGain=null;
let masterGain=null;

let recorder=null;
let chunks=[];
let recordedBlob=null;
let timerInterval=null;
let secondsRemaining=300;
let isRecording=false;


async function setupAudio(){

 if(audioContext){

  if(audioContext.state==="suspended")
   await audioContext.resume();

  return;
 }

 micStream=await navigator.mediaDevices.getUserMedia({
  audio:{
   echoCancellation:false,
   noiseSuppression:false,
   autoGainControl:false
  }
 });

 audioContext=new(window.AudioContext||window.webkitAudioContext)();

 await audioContext.resume();

 micSource=audioContext.createMediaStreamSource(micStream);

 tanpura.loop=true;
 tanpura.currentTime=0;

 tanpuraSource=audioContext.createMediaElementSource(tanpura);

 mixDestination=audioContext.createMediaStreamDestination();

 micGain=audioContext.createGain();
 micGain.gain.value=1.20;

 tanpuraRecordGain=audioContext.createGain();
 tanpuraRecordGain.gain.value=0.015;

 tanpuraSpeakerGain=audioContext.createGain();
 tanpuraSpeakerGain.gain.value=0;

 masterGain=audioContext.createGain();
 masterGain.gain.value=0.60;

 micSource.connect(micGain);
 micGain.connect(masterGain);

 tanpuraSource.connect(tanpuraRecordGain);
 tanpuraRecordGain.connect(masterGain);

 masterGain.connect(mixDestination);

 tanpuraSource.connect(tanpuraSpeakerGain);
 tanpuraSpeakerGain.connect(audioContext.destination);

 micStatus.innerHTML=
 '<span class="mic blink"></span> Microphone Ready';
}


recordBtn.addEventListener("click",async function(){
const firstName=firstNameInput.value.trim();
const surname=surnameInput.value.trim();

if(!firstName || !surname){
  message.innerHTML="Please enter your First Name and Surname first.";
  return;
}
 try{

  message.innerHTML="";

  await setupAudio();

  if(audioContext.state==="suspended")
   await audioContext.resume();

  chunks=[];
  recordedBlob=null;

  preview.pause();
  preview.removeAttribute("src");
  preview.style.display="none";

  tanpura.currentTime=0;

  recorder=new MediaRecorder(mixDestination.stream);

  recorder.ondataavailable=function(event){

   if(event.data && event.data.size>0)
    chunks.push(event.data);

  };

  recorder.onstop=function(){

   recordedBlob=new Blob(chunks,{
    type:recorder.mimeType||"audio/webm"
   });

   preview.src=URL.createObjectURL(recordedBlob);
   preview.style.display="block";

   submitBtn.disabled=false;

   message.innerHTML=
   "Recording ready. Play it, then tap SUBMIT.";

  };

  recorder.start();

  isRecording=true;

  try{

   tanpuraSpeakerGain.gain.value=0;

   await tanpura.play();

   tanpuraSpeakerGain.gain.linearRampToValueAtTime(
    0.03,
    audioContext.currentTime+2
   );

  }catch(e){

   console.log("Tanpura playback:",e);

  }

  recordBtn.disabled=true;
  stopBtn.disabled=false;
  submitBtn.disabled=true;

  onair.style.display="block";

  micStatus.innerHTML=
  '<span class="mic blink"></span> Microphone LIVE';

  secondsRemaining=300;

  updateTimer();

  clearInterval(timerInterval);

  timerInterval=setInterval(function(){

   secondsRemaining--;

   updateTimer();

   if(secondsRemaining<=0)
    stopRecording();

  },1000);

 }catch(error){

  console.error(error);

  message.innerHTML=
  "Microphone access is required. Please allow microphone permission and try again.";

  micStatus.innerHTML=
  '<span class="mic"></span> Microphone Access Required';

 }

});


stopBtn.addEventListener("click",function(){

 stopRecording();

});


function stopRecording(){

 if(!recorder || recorder.state!=="recording")
  return;

 recorder.stop();

 isRecording=false;

 clearInterval(timerInterval);

 tanpura.pause();
 tanpura.currentTime=0;

 if(tanpuraSpeakerGain)
  tanpuraSpeakerGain.gain.value=0;

 recordBtn.disabled=false;
 stopBtn.disabled=true;

 onair.style.display="none";

 micStatus.innerHTML=
 '<span class="mic blink"></span> Microphone Ready';

 timerDisplay.innerHTML="05:00";

}


function updateTimer(){

 const minutes=Math.floor(secondsRemaining/60);
 const seconds=secondsRemaining%60;

 timerDisplay.innerHTML=
 String(minutes).padStart(2,"0")+":"+
 String(seconds).padStart(2,"0");

}


submitBtn.addEventListener("click",async function(){

 if(!recordedBlob){

  message.innerHTML=
  "Please record your Namokar Jaap first.";

  return;

 }

 const firstName=firstNameInput.value.trim();
 const surname=surnameInput.value.trim();

 if(!firstName || !surname){

  message.innerHTML=
  "Please enter your First Name and Surname.";

  return;

 }

 submitBtn.disabled=true;
 recordBtn.disabled=true;

 message.innerHTML=
 "Submitting your Namokar Jaap...";

 try{

  const base64Audio=await blobToBase64(recordedBlob);

  const data={
   firstName:firstName,
   surname:surname,
   fullName:firstName+" "+surname,
   timestamp:new Date().toISOString(),
   audio:base64Audio
  };

  await fetch(SCRIPT_URL,{
   method:"POST",
   mode:"no-cors",
   headers:{
    "Content-Type":"text/plain;charset=utf-8"
   },
   body:JSON.stringify(data)
  });

  message.innerHTML=
  "🙏 Thank you. Your Namokar Jaap has been submitted LIVE.";

  chunks=[];
  recordedBlob=null;

  preview.pause();
  preview.removeAttribute("src");
  preview.style.display="none";

  submitBtn.disabled=true;
  recordBtn.disabled=false;

  setTimeout(function(){

  window.location.reload();

  },10000);

 }catch(error){

  console.error(error);

  message.innerHTML=
  "There was a problem submitting. Please try again.";

  submitBtn.disabled=false;
  recordBtn.disabled=false;

 }

});


function blobToBase64(blob){

 return new Promise(function(resolve,reject){

  const reader=new FileReader();

  reader.onloadend=function(){

   resolve(reader.result.split(",")[1]);

  };

  reader.onerror=reject;

  reader.readAsDataURL(blob);

 });

}

</script>

</body>
</html>
