<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1008 Days Live Namokar Jaap</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#fffdf7;
    text-align:center;
    color:#333;
}

.container{
    max-width:500px;
    margin:auto;
}

h1{
    font-size:28px;
    margin-bottom:5px;
}

.subtitle{
    font-size:17px;
    margin-bottom:20px;
}

input{
    width:90%;
    padding:13px;
    margin:6px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:17px;
    box-sizing:border-box;
}

#micStatus{
    margin-top:18px;
    font-weight:bold;
}

.mic{
    display:inline-block;
    width:14px;
    height:14px;
    background:#16a34a;
    border-radius:50%;
    margin-right:7px;
}

.blink{
    animation:blink 1s infinite;
}

@keyframes blink{
    0%,100%{opacity:1;}
    50%{opacity:.25;}
}

#onair{
    font-size:22px;
    font-weight:bold;
    color:#d00;
    margin:10px 0;
}

#timer{
    font-size:24px;
    font-weight:bold;
    margin:10px;
}

button{
    border:0;
    border-radius:9px;
    padding:13px 22px;
    margin:6px;
    font-size:17px;
    cursor:pointer;
}

#recordBtn{
    background:#c62828;
    color:white;
}

#stopBtn{
    background:#555;
    color:white;
}

#submitBtn{
    background:#16803c;
    color:white;
}

button:disabled{
    opacity:.45;
}

audio{
    width:95%;
    margin-top:15px;
}

#message{
    margin-top:15px;
    font-weight:bold;
}

.small{
    font-size:14px;
    color:#666;
    margin-top:15px;
}

</style>
</head>

<body>

<div class="container">

<h1>🙏 Namokar Radio</h1>

<div class="subtitle">
<b>1008 DAYS LIVE NAMOKAR JAAP</b>
</div>

<input
    type="text"
    id="firstName"
    placeholder="First Name"
    autocomplete="given-name"
>

<input
    type="text"
    id="surname"
    placeholder="Surname"
    autocomplete="family-name"
>

<div id="micStatus">
    <span class="mic"></span>
    Microphone Ready
</div>

<div id="onair" style="display:none;">
    🔴 ON AIR
</div>

<div id="timer">
    05:00
</div>

<div>

<button id="recordBtn">
    🎙 RECORD
</button>

<button id="stopBtn" disabled>
    ⏹ STOP
</button>

</div>

<audio id="preview" controls style="display:none;"></audio>

<br>

<button id="submitBtn" disabled>
    SUBMIT
</button>

<div id="message"></div>

<div class="small">
Your voice will become part of the LIVE Namokar Jaap.
</div>

<audio
    id="tanpura"
    src="tanpura.mp3"
    preload="auto"
    loop>
</audio>

</div>


<script>

const recordBtn = document.getElementById("recordBtn");
const stopBtn = document.getElementById("stopBtn");
const submitBtn = document.getElementById("submitBtn");

const preview = document.getElementById("preview");
const tanpura = document.getElementById("tanpura");

const micStatus = document.getElementById("micStatus");
const onair = document.getElementById("onair");
const timerDisplay = document.getElementById("timer");
const message = document.getElementById("message");

const firstNameInput = document.getElementById("firstName");
const surnameInput = document.getElementById("surname");


/* GOOGLE APPS SCRIPT */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwasN4Nh7O1C4Nhpdn1noFyRDJ7rz7mN9CnHa1c8AzibfaR_HKbezA3C7u_pg9fxolCPQ/exec";


/* AUDIO VARIABLES */

let audioContext = null;

let micStream = null;
let micSource = null;
let tanpuraSource = null;

let mixDestination = null;

let micGain = null;
let tanpuraRecordGain = null;
let tanpuraSpeakerGain = null;
let masterGain = null;

let recorder = null;

let chunks = [];

let recordedBlob = null;

let timerInterval = null;

let secondsRemaining = 300;

let isRecording = false;


/*
IMPORTANT:

Create the AudioContext and audio graph ONCE.

We do NOT destroy it after every recording.

This is what makes:

RECORD → STOP → PLAY → RECORD AGAIN

work properly on mobile.
*/


async function setupAudio(){

    if(audioContext){

        if(audioContext.state === "suspended"){
            await audioContext.resume();
        }

        return;
    }


    /* MICROPHONE */

    micStream =
        await navigator.mediaDevices.getUserMedia({

            audio:{
                echoCancellation:false,
                noiseSuppression:false,
                autoGainControl:false
            }

        });


    /* AUDIO CONTEXT */

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    await audioContext.resume();


    /* MICROPHONE SOURCE */

    micSource =
        audioContext.createMediaStreamSource(
            micStream
        );


    /* TANPURA */

    tanpura.loop = true;

    tanpura.currentTime = 0;


    tanpuraSource =
        audioContext.createMediaElementSource(
            tanpura
        );


    /* RECORDING DESTINATION */

    mixDestination =
        audioContext.createMediaStreamDestination();


    /* MICROPHONE GAIN */

    micGain =
        audioContext.createGain();

    micGain.gain.value = 1.00;


    /* TANPURA RECORDING GAIN */

    tanpuraRecordGain =
        audioContext.createGain();

    tanpuraRecordGain.gain.value = 0.01;


    /* TANPURA PHONE SPEAKER GAIN */

    tanpuraSpeakerGain =
        audioContext.createGain();

    tanpuraSpeakerGain.gain.value = 0;


    /*
    MASTER GAIN

    This was added because it removed
    the crackling/distortion.
    */

    masterGain =
        audioContext.createGain();

    masterGain.gain.value = 0.60;


    /*
    MICROPHONE → MASTER
    */

    micSource.connect(
        micGain
    );

    micGain.connect(
        masterGain
    );


    /*
    TANPURA → RECORDING

    Very soft Tanpura in the
    actual submitted recording.
    */

    tanpuraSource.connect(
        tanpuraRecordGain
    );

    tanpuraRecordGain.connect(
        masterGain
    );


    /*
    MASTER → RECORDER
    */

    masterGain.connect(
        mixDestination
    );


    /*
    TANPURA → PHONE SPEAKER

    Separate from recording volume.
    */

    tanpuraSource.connect(
        tanpuraSpeakerGain
    );

    tanpuraSpeakerGain.connect(
        audioContext.destination
    );


    /*
    MICROPHONE PERMISSION SUCCESS
    */

    micStatus.innerHTML =
        '<span class="mic"></span> Microphone Ready';

}


/* RECORD */

recordBtn.addEventListener(
    "click",
    async function(){

        try{

            message.innerHTML = "";

            /*
            Ask for microphone only if
            audio has not already been created.
            */

            await setupAudio();


            /*
            Resume AudioContext if mobile
            browser suspended it.
            */

            if(audioContext.state === "suspended"){

                await audioContext.resume();

            }


            /*
            Clear previous recording.
            */

            chunks = [];

            recordedBlob = null;

            preview.pause();

            preview.removeAttribute("src");

            preview.style.display = "none";


            /*
            Reset Tanpura position.
            */

            tanpura.currentTime = 0;


            /*
            Create a NEW MediaRecorder
            for every recording.

            This is important for
            re-recording.
            */

            recorder =
                new MediaRecorder(
                    mixDestination.stream
                );


            recorder.ondataavailable =
                function(event){

                    if(event.data &&
                       event.data.size > 0){

                        chunks.push(
                            event.data
                        );

                    }

                };


            recorder.onstop =
                function(){

                    recordedBlob =
                        new Blob(
                            chunks,
                            {
                                type:
                                recorder.mimeType ||
                                "audio/webm"
                            }
                        );


                    const audioURL =
                        URL.createObjectURL(
                            recordedBlob
                        );


                    preview.src =
                        audioURL;

                    preview.style.display =
                        "block";


                    submitBtn.disabled =
                        false;


                    message.innerHTML =
                        "Recording ready. You can play it or record again.";

                };


            /*
            START RECORDER
            */

            recorder.start();


            isRecording = true;


            /*
            START TANPURA

            Catch mobile autoplay/play errors
            silently.
            */

            try{

                await tanpura.play();

            }catch(e){

                console.log(
                    "Tanpura playback:",
                    e
                );

            }


            /*
            UI
            */

            recordBtn.disabled =
                true;

            stopBtn.disabled =
                false;

            submitBtn.disabled =
                true;

            onair.style.display =
                "block";

            micStatus.innerHTML =
                '<span class="mic blink"></span> Microphone LIVE';


            /*
            TIMER
            */

            secondsRemaining = 300;

            updateTimer();


            clearInterval(
                timerInterval
            );


            timerInterval =
                setInterval(

                    function(){

                        secondsRemaining--;

                        updateTimer();


                        if(secondsRemaining <= 0){

                            stopRecording();

                        }

                    },

                    1000

                );


        }catch(error){

            console.error(error);


            message.innerHTML =
                "Microphone access is required. Please allow microphone permission and try again.";


            micStatus.innerHTML =
                '<span class="mic"></span> Microphone Access Required';

        }

    }
);


/* STOP */

stopBtn.addEventListener(
    "click",
    function(){

        stopRecording();

    }
);


function stopRecording(){

    if(!recorder ||
       recorder.state !== "recording"){

        return;

    }


    recorder.stop();


    isRecording = false;


    clearInterval(
        timerInterval
    );


    /*
    Stop Tanpura.

    IMPORTANT:
    We do NOT close the AudioContext.
    We do NOT stop the microphone stream.

    This allows another recording.
    */

    tanpura.pause();

    tanpura.currentTime = 0;


    /*
    UI
    */

    recordBtn.disabled =
        false;

    stopBtn.disabled =
        true;

    onair.style.display =
        "none";

    micStatus.innerHTML =
        '<span class="mic"></span> Microphone Ready';


    timerDisplay.innerHTML =
        "05:00";

}


/* TIMER */

function updateTimer(){

    const minutes =
        Math.floor(
            secondsRemaining / 60
        );

    const seconds =
        secondsRemaining % 60;


    timerDisplay.innerHTML =
        String(minutes).padStart(2,"0")
        + ":"
        +
        String(seconds).padStart(2,"0");

}


/* SUBMIT */

submitBtn.addEventListener(
    "click",
    async function(){

        if(!recordedBlob){

            message.innerHTML =
                "Please record your Namokar Jaap first.";

            return;

        }


        const firstName =
            firstNameInput.value.trim();

        const surname =
            surnameInput.value.trim();


        if(!firstName ||
           !surname){

            message.innerHTML =
                "Please enter your First Name and Surname.";

            return;

        }


        submitBtn.disabled =
            true;

        recordBtn.disabled =
            true;

        message.innerHTML =
            "Submitting your Namokar Jaap...";


        try{

            const base64Audio =
                await blobToBase64(
                    recordedBlob
                );


            const data = {

                firstName:
                    firstName,

                surname:
                    surname,

                fullName:
                    firstName + " " + surname,

                timestamp:
                    new Date().toISOString(),

                audio:
                    base64Audio

            };


            await fetch(
                SCRIPT_URL,
                {
                    method:"POST",

                    mode:"no-cors",

                    headers:{
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(data)
                }
            );


            /*
            SUCCESS
            */

            message.innerHTML =
                "🙏 Thank you. Your Namokar Jaap has been submitted LIVE.";


            /*
            Reset recording only.

            Microphone permission stays available.
            */

            chunks = [];

            recordedBlob = null;

            preview.pause();

            preview.removeAttribute("src");

            preview.style.display =
                "none";


            submitBtn.disabled =
                true;

            recordBtn.disabled =
                false;


        }catch(error){

            console.error(error);


            message.innerHTML =
                "There was a problem submitting. Please try again.";

            submitBtn.disabled =
                false;

            recordBtn.disabled =
                false;

        }

    }
);


/* BLOB → BASE64 */

function blobToBase64(blob){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onloadend =
                function(){

                    const result =
                        reader.result;


                    const base64 =
                        result.split(",")[1];


                    resolve(base64);

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                blob
            );

        }
    );

}

</script>

</body>
</html>
