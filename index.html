<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namokar Radio</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
  text-align:center;
}

.box{
  max-width:480px;
  margin:auto;
  padding:18px 15px;
}

h1{
  font-size:28px;
  margin:4px 0 5px;
}

h2{
  font-size:19px;
  font-weight:normal;
  margin:4px 0 7px;
}

p{
  color:#d1d5db;
  margin:5px 0 12px;
  font-size:15px;
  line-height:1.4;
}

input{
  width:90%;
  max-width:360px;
  padding:10px 12px;
  margin:4px;
  border:0;
  border-radius:8px;
  font-size:16px;
}

#devoteeName{
  font-size:18px;
  font-weight:bold;
  margin:6px 0;
  min-height:22px;
}

#onair{
  font-size:18px;
  color:#ef4444;
  font-weight:bold;
  margin:5px 0;
  min-height:22px;
}

#timerLabel{
  font-size:12px;
  color:#d1d5db;
  margin-top:3px;
}

#timer{
  font-size:25px;
  font-weight:bold;
  margin:2px 0 4px;
}

button{
  width:150px;
  padding:11px;
  margin:4px;
  border:0;
  border-radius:9px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

#record{
  background:#f59e0b;
  color:white;
}

#stop{
  background:#dc2626;
  color:white;
}

#submit{
  background:#16a34a;
  color:white;
  width:180px;
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

audio{
  width:100%;
  height:42px;
  margin:7px 0 4px;
}

#status{
  margin-top:5px;
  font-size:14px;
  color:#fbbf24;
  min-height:22px;
}

#status.success{
  font-size:21px;
  line-height:1.5;
  font-weight:bold;
  color:#22c55e;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="box">

<h1>NAMOKAR RADIO</h1>

<h2>CHANT NAMOKAR</h2>

<p>
Your voice on Namokar Radio<br>
<strong>Up to 5 minutes</strong>
</p>

<input
  id="firstName"
  type="text"
  placeholder="First Name"
  autocomplete="given-name">

<input
  id="surname"
  type="text"
  placeholder="Surname"
  autocomplete="family-name">

<div id="devoteeName"></div>

<div id="onair"></div>

<div id="timerLabel">TIME REMAINING</div>
<div id="timer">05:00</div>

<button id="record">🎙️ RECORD</button>
<button id="stop" disabled>⏹️ STOP</button>

<audio id="audio" controls></audio>

<button id="submit" disabled>✅ SUBMIT</button>

<div id="status">Enter your name and tap RECORD</div>

</div>

<script>

let recorder;
let audioChunks=[];
let audioBlob=null;
let timerInterval=null;
let seconds=0;
let maxTimer=null;

const recordButton=document.getElementById("record");
const stopButton=document.getElementById("stop");
const submitButton=document.getElementById("submit");
const audioPlayer=document.getElementById("audio");
const status=document.getElementById("status");
const firstNameInput=document.getElementById("firstName");
const surnameInput=document.getElementById("surname");
const devoteeName=document.getElementById("devoteeName");
const onair=document.getElementById("onair");
const timer=document.getElementById("timer");

function getFullName(){

  return (
    firstNameInput.value.trim()+" "+
    surnameInput.value.trim()
  ).trim();

}


/* COUNTDOWN */

function updateTimer(){

  seconds++;

  let remaining=300-seconds;

  if(remaining<0){
    remaining=0;
  }

  let minutes=
    String(Math.floor(remaining/60)).padStart(2,"0");

  let secs=
    String(remaining%60).padStart(2,"0");

  timer.innerText=
    minutes+":"+secs;
}


/* RESET FOR NEXT DEVOTEE */

function resetForm(){

  firstNameInput.value="";
  surnameInput.value="";

  devoteeName.innerText="";
  onair.innerText="";

  audioPlayer.pause();
  audioPlayer.removeAttribute("src");
  audioPlayer.load();

  audioBlob=null;
  audioChunks=[];

  seconds=0;
  timer.innerText="05:00";

  recordButton.disabled=false;
  stopButton.disabled=true;
  submitButton.disabled=true;

  clearInterval(timerInterval);
  clearTimeout(maxTimer);

  status.className="";
  status.innerText=
    "Enter your name and tap RECORD";
}


/* RECORD */

recordButton.onclick=async function(){

  const firstName=
    firstNameInput.value.trim();

  const surname=
    surnameInput.value.trim();

  if(!firstName || !surname){

    status.innerText=
      "Please enter First Name and Surname.";

    return;
  }

  devoteeName.innerText=
    getFullName();

  try{

    const stream=
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    audioChunks=[];

    recorder=
      new MediaRecorder(stream);

    recorder.ondataavailable=function(event){

      if(event.data.size>0){
        audioChunks.push(event.data);
      }

    };

    recorder.onstop=function(){

      audioBlob=
        new Blob(
          audioChunks,
          {type:"audio/webm"}
        );

      audioPlayer.src=
        URL.createObjectURL(audioBlob);

      submitButton.disabled=false;

      onair.innerText="";

      status.className="";

      status.innerText=
        "Recording ready. Play it, then tap SUBMIT.";

      stream.getTracks().forEach(
        track=>track.stop()
      );

    };

    recorder.start();

    recordButton.disabled=true;
    stopButton.disabled=false;
    submitButton.disabled=true;

    seconds=0;
    timer.innerText="05:00";

    timerInterval=
      setInterval(updateTimer,1000);

    onair.innerText=
      "🔴 ON AIR • Recording";

    status.innerText=
      "Chant Namokar Jaap";

    maxTimer=
      setTimeout(function(){

        if(
          recorder &&
          recorder.state!=="inactive"
        ){

          recorder.stop();

          recordButton.disabled=false;
          stopButton.disabled=true;

          clearInterval(timerInterval);

          timer.innerText="00:00";

          status.innerText=
            "5 minutes completed. Recording ready.";

        }

      },300000);

  }

  catch(error){

    status.innerText=
      "Microphone access was not allowed.";

    console.error(error);

  }

};


/* STOP */

stopButton.onclick=function(){

  if(
    recorder &&
    recorder.state!=="inactive"
  ){

    recorder.stop();

    recordButton.disabled=false;
    stopButton.disabled=true;

    clearInterval(timerInterval);
    clearTimeout(maxTimer);

    onair.innerText="";

  }

};


/* SUBMIT */

submitButton.onclick=function(){

  if(!audioBlob){
    return;
  }

  const firstName=
    firstNameInput.value.trim();

  const surname=
    surnameInput.value.trim();

  const fullName=
    getFullName();

  status.className="";
  status.innerText="Submitting...";

  const now=
    new Date();

  const timestamp=
    now.getFullYear()+"-"+
    String(now.getMonth()+1).padStart(2,"0")+"-"+
    String(now.getDate()).padStart(2,"0")+"_"+

    String(now.getHours()).padStart(2,"0")+"-"+
    String(now.getMinutes()).padStart(2,"0")+"-"+
    String(now.getSeconds()).padStart(2,"0");

  const reader=
    new FileReader();

  reader.onloadend=function(){

    const base64Audio=
      reader.result.split(",")[1];

    const formData=
      new URLSearchParams();

    formData.append(
      "audio",
      base64Audio
    );

    formData.append(
      "firstName",
      firstName
    );

    formData.append(
      "surname",
      surname
    );

    formData.append(
      "fullName",
      fullName
    );

    formData.append(
      "timestamp",
      timestamp
    );

    fetch(
      "https://script.google.com/macros/s/AKfycbwasN4Nh7O1C4Nhpdn1noFyRDJ7rz7mN9CnHa1c8AzibfaR_HKbezA3C7u_pg9fxolCPQ/exec",
      {
        method:"POST",
        mode:"no-cors",
        headers:{
          "Content-Type":
          "application/x-www-form-urlencoded"
        },
        body:
          formData.toString()
      }
    )

    .then(function(){

      status.className="success";

      status.innerHTML=
        "✅ SUBMITTED TO NAMOKAR RADIO<br>Thank you!";

      submitButton.disabled=true;

      setTimeout(function(){

        resetForm();

      },4000);

    })

    .catch(function(error){

      status.className="";

      status.innerText=
        "Submission failed. Please try again.";

      console.error(error);

    });

  };

  reader.readAsDataURL(audioBlob);

};

</script>

</body>
</html>
